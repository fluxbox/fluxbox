! name: sage
! default fluxbox style: dark slate base, sage accent for focus and selection

background:                             Gradient Vertical
background.color:                       #111513
background.colorTo:                     #3a4843

! fonts

window.font:                            sans-10:bold
menu.title.font:                        sans-10:bold
menu.frame.font:                        sans-10
toolbar.workspace.font:                 sans-10:bold
toolbar.clock.font:                     sans-10:bold
toolbar.iconbar.focused.font:           sans-10:bold
toolbar.iconbar.unfocused.font:         sans-10

! menu

menu.bevelWidth:                        3
menu.borderWidth:                       1
menu.borderColor:                       #0c0f0e
menu.itemHeight:                        20
menu.titleHeight:                       22
menu.roundCorners:                      TopLeft TopRight

menu.title:                             Raised Gradient Vertical
menu.title.color:                       #9bb8aa
menu.title.colorTo:                     #5b7569
menu.title.textColor:                   #121816
menu.title.justify:                     center

menu.frame:                             Flat Gradient Vertical
menu.frame.color:                       #262e2b
menu.frame.colorTo:                     #1b211f
menu.frame.textColor:                   #d5dcd8
menu.frame.disableColor:                #8a9690
menu.frame.underlineColor:              #8fa89c
menu.frame.justify:                     left

menu.hilite:                            Flat Gradient Vertical
menu.hilite.color:                      #9bb8aa
menu.hilite.colorTo:                    #6f8c7f
menu.hilite.textColor:                  #121816

menu.bullet:                            triangle
menu.bullet.position:                   right

! toolbar

toolbar.height:                         24
toolbar.bevelWidth:                     2
toolbar.borderWidth:                    1
toolbar.borderColor:                    #0c0f0e

toolbar:                                Flat Gradient Vertical
toolbar.color:                          #262e2b
toolbar.colorTo:                        #171c1a

toolbar.workspace:                      ParentRelative
toolbar.workspace.textColor:            #aebdb6
toolbar.workspace.justify:              center

toolbar.clock:                          ParentRelative
toolbar.clock.textColor:                #aebdb6
toolbar.clock.justify:                  center

toolbar.button:                         ParentRelative
toolbar.button.picColor:                #aebdb6
toolbar.button.pressed:                 Flat Gradient Vertical
toolbar.button.pressed.color:           #6f8c7f
toolbar.button.pressed.colorTo:         #9bb8aa
toolbar.button.pressed.picColor:        #121816

toolbar.iconbar.empty:                  ParentRelative
toolbar.iconbar.borderWidth:            0

toolbar.iconbar.focused:                Flat Gradient Vertical
toolbar.iconbar.focused.color:          #9bb8aa
toolbar.iconbar.focused.colorTo:        #5b7569
toolbar.iconbar.focused.textColor:      #121816
toolbar.iconbar.focused.justify:        center

toolbar.iconbar.unfocused:              ParentRelative
toolbar.iconbar.unfocused.textColor:    #8a9690
toolbar.iconbar.unfocused.justify:      center

! window

window.bevelWidth:                      5
window.borderWidth:                     1
window.borderColor:                     #0c0f0e
window.title.height:                    24
window.handleWidth:                     4
window.justify:                         center
window.roundCorners:                    TopLeft TopRight

window.title.focus:                     Flat Gradient Vertical
window.title.focus.color:               #9bb8aa
window.title.focus.colorTo:             #5b7569
window.title.unfocus:                   Flat Gradient Vertical
window.title.unfocus.color:             #2c3431
window.title.unfocus.colorTo:           #1e2522

window.label.focus:                     ParentRelative
window.label.focus.textColor:           #121816
window.label.unfocus:                   ParentRelative
window.label.unfocus.textColor:         #8a9690

window.button.focus:                    ParentRelative
window.button.focus.picColor:           #121816
window.button.unfocus:                  ParentRelative
window.button.unfocus.picColor:         #6b7772
window.button.pressed:                  Flat Gradient Vertical
window.button.pressed.color:            #3a4843
window.button.pressed.colorTo:          #262e2b
window.button.pressed.picColor:         #ffffff

window.handle.focus:                    Flat Gradient Vertical
window.handle.focus.color:              #6f8c7f
window.handle.focus.colorTo:            #5b7569
window.handle.unfocus:                  Flat
window.handle.unfocus.color:            #1e2522

window.grip.focus:                      Flat
window.grip.focus.color:                #8fa89c
window.grip.unfocus:                    Flat
window.grip.unfocus.color:              #2c3431

! slit

slit:                                   ParentRelative
slit.borderWidth:                       0
